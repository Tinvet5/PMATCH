<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compresores · PLUGIN MATCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="compressors">
  <header class="site-header compact-header">
    <a class="brand-pill is-active" href="index.html">PLUGINS/VST</a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="index.html#categories">CADENAS</a>
      <a href="index.html#monthly">NOTICIAS</a>
      <a href="index.html#categories">PMC</a>
      <a href="index.html#categories">PM-GAME</a>
    </nav>
    <label class="search-shell">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="categorySearch" type="search" placeholder="BUSCAR COMPRESOR" autocomplete="off" />
    </label>
    <a class="avatar-button" href="index.html" aria-label="Inicio"><span class="avatar-head"></span><span class="avatar-body"></span></a>
  </header>

  <main class="browser-layout">
    <aside class="browser-sidebar">
      <h1>COMPRESORES</h1>
      <div class="subtype-list" id="subtypeList" role="group" aria-label="Tipos de compresor">
        <button class="subtype-button" data-subtype="all">TODOS</button>
        <button class="subtype-button" data-subtype="optical">ÓPTICOS</button>
        <button class="subtype-button" data-subtype="vari-mu">VARI-MU</button>
        <button class="subtype-button" data-subtype="vca">VCA</button>
        <button class="subtype-button active" data-subtype="fet">FET</button>
        <button class="subtype-button" data-subtype="multiband">MULTIBANDA</button>
        <button class="subtype-button" data-subtype="parametric">PARAMÉTRICOS</button>
        <button class="subtype-button" data-subtype="lookahead">LOOKAHEAD</button>
        <button class="subtype-button" data-subtype="pwm">PWM</button>
        <button class="subtype-button" data-subtype="sidechain">SIDECHAIN</button>
      </div>

      <div class="rating-panel">
        <h2>TOP 3 MEJOR RATING <span>★</span></h2>
        <ol>
          <li>FET76 - ARTURIA</li>
          <li>FETISH - ANALOG OBSESSION</li>
          <li>1176 COLLECTION - UNIVERSAL AUDIO</li>
        </ol>
      </div>
    </aside>

    <section class="plugin-list-shell" aria-label="Lista de compresores">
      <div class="plugin-list" id="pluginList"></div>
      <p class="empty-state" id="pluginEmpty" hidden>No hay plugins que coincidan con este filtro.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
