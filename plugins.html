<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Catálogo público de plugins de PLUGIN MATCH." />
  <title>Catálogo · PLUGIN MATCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500;1,600;1,700&family=Roboto+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="catalog.css" />
</head>
<body data-page="catalog">
  <header class="site-header compact-header">
    <a class="brand-pill is-active" href="index.html">PLUGINS/VST</a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a class="is-current" href="plugins.html">CATÁLOGO</a>
      <a href="index.html#monthly">DESTACADOS</a>
      <a href="index.html#categories">FAMILIAS</a>
      <a href="index.html#categories">PM-GAME</a>
    </nav>
    <label class="search-shell header-search" aria-label="Buscar plugins">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="catalogHeaderSearch" data-catalog-search type="search" placeholder="BUSCAR PLUGIN" autocomplete="off" />
    </label>
    <button class="avatar-button" type="button" aria-label="Cuenta" data-account-placeholder><span class="avatar-head"></span><span class="avatar-body"></span></button>
    <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobileNavPanel"><span></span><span></span></button>
  </header>

  <div class="mobile-nav-panel" id="mobileNavPanel" hidden>
    <button class="mobile-nav-backdrop" type="button" data-mobile-nav-dismiss aria-label="Cerrar menú"></button>
    <div class="mobile-nav-sheet">
      <div class="mobile-nav-top">
        <strong>PLUGIN MATCH</strong>
        <button id="mobileNavClose" class="mobile-nav-close" type="button" aria-label="Cerrar menú">×</button>
      </div>
      <nav aria-label="Navegación móvil">
        <a href="plugins.html">CATÁLOGO <span>→</span></a>
        <a href="index.html#monthly">DESTACADOS <span>→</span></a>
        <a href="index.html#categories">FAMILIAS <span>→</span></a>
        <a href="index.html#categories">PM-GAME <span>→</span></a>
      </nav>
      <a class="mobile-studio-link" href="studio.html">DEV STUDIO</a>
    </div>
  </div>

  <main class="catalog-page">
    <section class="catalog-intro section-shell">
      <p class="catalog-kicker">PLUGIN MATCH DATABASE</p>
      <div class="catalog-title-row">
        <h1>CATÁLOGO DE PLUGINS</h1>
        <p id="catalogSummary">Cargando catálogo…</p>
      </div>
    </section>

    <section class="catalog-workspace section-shell">
      <div class="catalog-mobile-actions">
        <button id="openMobileFilters" class="mobile-filter-button" type="button" aria-expanded="false" aria-controls="catalogSidebar">
          <span>FILTROS</span><strong id="mobileFilterCount">0</strong>
        </button>
        <div class="active-filter-chips" id="activeFilterChips" aria-live="polite"></div>
      </div>
      <aside class="catalog-sidebar" id="catalogSidebar" aria-label="Filtros del catálogo">
        <div class="catalog-sidebar-mobile-head">
          <strong>FILTROS</strong>
          <button id="closeMobileFilters" type="button" aria-label="Cerrar filtros">×</button>
        </div>
        <div class="filter-group">
          <label for="catalogSearch">BÚSQUEDA</label>
          <input id="catalogSearch" type="search" placeholder="Nombre, marca, uso…" autocomplete="off" />
        </div>
        <div class="filter-group">
          <label for="familyFilter">FAMILIA</label>
          <select id="familyFilter"><option value="">TODAS</option></select>
        </div>
        <div class="filter-group">
          <label for="typeFilter">TIPO</label>
          <select id="typeFilter"><option value="">TODOS</option></select>
        </div>
        <div class="filter-group">
          <label for="subgroupFilter">SUBGRUPO</label>
          <select id="subgroupFilter"><option value="">TODOS</option></select>
        </div>
        <div class="filter-group">
          <label for="developerFilter">DESARROLLADOR</label>
          <select id="developerFilter"><option value="">TODOS</option></select>
        </div>
        <button id="clearCatalogFilters" class="clear-filters" type="button">LIMPIAR FILTROS</button>
        <button id="applyMobileFilters" class="apply-mobile-filters" type="button">VER RESULTADOS</button>
      </aside>

      <div class="catalog-results">
        <div class="catalog-toolbar">
          <div>
            <span class="catalog-result-count" id="catalogResultCount">0</span>
            <span class="catalog-result-label">RESULTADOS</span>
          </div>
          <select id="sortCatalog" aria-label="Ordenar catálogo">
            <option value="name">A–Z</option>
            <option value="developer">DESARROLLADOR</option>
            <option value="type">TIPO</option>
          </select>
        </div>
        <div class="plugin-catalog-grid" id="pluginCatalogGrid" aria-live="polite"></div>
        <div class="catalog-empty" id="catalogEmpty" hidden>
          <strong>SIN RESULTADOS</strong>
          <p>Prueba con otro término o limpia los filtros.</p>
        </div>
      </div>
    </section>
  </main>

  <a class="dev-studio-launch" href="studio.html">DEV STUDIO</a>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="module-defaults.js"></script>
  <script src="catalogo-inicial.js"></script>
  <script src="excel-importer.js"></script>
  <script src="studio-storage.js"></script>
  <script src="public-catalog.js"></script>
  <script src="ui.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
