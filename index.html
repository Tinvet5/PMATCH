<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="PLUGIN MATCH — aprende a usar plugins VST, descubre herramientas, categorías y recomendaciones de uso." />
  <title>PLUGIN MATCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="home">
  <header class="site-header">
    <a class="brand-pill is-active" href="index.html">PLUGINS/VST</a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="#categories">CADENAS</a>
      <a href="#monthly">NOTICIAS</a>
      <a href="#categories">PMC</a>
      <a href="#categories">PM-GAME</a>
    </nav>
    <label class="search-shell" aria-label="Búsqueda personalizada">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="globalSearch" type="search" placeholder="BÚSQUEDA PERSONALIZADA" autocomplete="off" />
    </label>
    <button class="avatar-button" type="button" aria-label="Perfil de usuario">
      <span class="avatar-head"></span><span class="avatar-body"></span>
    </button>
  </header>

  <main>
    <section class="hero" aria-labelledby="heroTitle">
      <div class="hero-wordmark" id="heroTitle" aria-label="PLUGIN MATCH">
        <div class="hero-line hero-line-top"><span class="heart-mark" aria-hidden="true">♥</span><span>PLUGIN</span></div>
        <div class="signal-line" aria-hidden="true"></div>
        <div class="hero-line hero-line-bottom">MATCH</div>
      </div>
      <p class="hero-tagline">TODOS LOS PLUGINS CON SUS ENLACES DE DESCARGA, ESPECIFICACIONES, EXPLICACIONES DE FUNCIONAMIENTO Y RECOMENDACIONES DE USO EN UN SOLO LUGAR.</p>
    </section>

    <section class="section-shell monthly-section" id="monthly" aria-labelledby="monthlyTitle">
      <h2 class="section-title" id="monthlyTitle">PLUGINS DEL MES</h2>
      <div class="featured-stage">
        <button class="round-arrow left" id="featuredPrev" type="button" aria-label="Plugin anterior">‹</button>
        <article class="featured-card" id="featuredCard" tabindex="0">
          <img id="featuredImage" src="assets/frontier.png" alt="Frontier de D16 Group" />
          <h3 id="featuredName">FRONTIER - D16 GROUP</h3>
          <p id="featuredMeta">Limiter · Free</p>
        </article>
        <button class="round-arrow right" id="featuredNext" type="button" aria-label="Plugin siguiente">›</button>
      </div>
    </section>

    <section class="section-shell category-section" id="categories" aria-labelledby="categoriesTitle">
      <div class="filter-tabs" role="tablist" aria-label="Filtros de plugins">
        <button class="filter-tab active" type="button" data-filter="all">FILTROS</button>
        <button class="filter-tab" type="button" data-filter="type">TIPO</button>
        <button class="filter-tab" type="button" data-filter="brand">MARCA</button>
        <button class="filter-tab" type="button" data-filter="free">GRATIS</button>
        <button class="filter-tab" type="button" data-filter="recent">MÁS RECIENTES</button>
        <button class="filter-tab" type="button" data-filter="rating">MEJOR VALORADOS</button>
      </div>
      <div class="categories-grid" id="categoryGrid"></div>
      <p class="empty-state" id="emptyState" hidden>No encontramos resultados con esa búsqueda.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
